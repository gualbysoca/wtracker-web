name = "wtracker-web"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[build]
command = "npm --prefix frontend ci --no-audit --no-fund && npm --prefix frontend run build"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/uploads/*", "/internal/*", "/health"]

[vars]
FRONTEND_URL = "https://alimentaria.simpler.bo"
# BD gestionada: Supabase "wtracker-prd" (sa-east-1) vía pooler en modo transacción.
# DB_PASSWORD, JWT_SECRET y JWT_REFRESH_SECRET se configuran con `wrangler secret put`.
DB_HOST = "aws-1-sa-east-1.pooler.supabase.com"
DB_PORT = "6543"
DB_NAME = "postgres"
DB_USER = "wtracker_app.dgnzgiujwlxafcafjblx"
DB_SSL = "true"
DB_POOL_MAX = "10"
DB_CONNECTION_TIMEOUT_MS = "10000"
# Evidencias en Cloudflare R2: el contenedor escribe vía el Worker (binding EVIDENCE_BUCKET).
# STORAGE_PROXY_TOKEN se configura con `wrangler secret put`.
STORAGE_DRIVER = "r2-worker"
STORAGE_PROXY_URL = "https://alimentaria.simpler.bo/internal/storage"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "wtracker-evidence"

[[containers]]
class_name = "MyContainer"
image = "./Dockerfile"
max_instances = 5

[[durable_objects.bindings]]
class_name = "MyContainer"
name = "MY_CONTAINER"



[observability]
enabled = true

[previews]
[exports.MyContainer]
type = "durable-object"
storage = "sqlite"
